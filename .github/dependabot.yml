version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # One pull request for a batch of bumps, since each must re-run gh actions-lock.
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v7 changes how the next version is calculated and may skip a release
      # for pushes with only non-releasing commits, which conflicts with the
      # Release workflow's default_bump: patch tagging. Migrate deliberately.
      - dependency-name: mathieudutour/github-tag-action
        update-types: ["version-update:semver-major"]
