name: Release

# Auto-versions and publishes a GitHub Release on every push to main.
# The next semver is derived from Conventional Commit messages since the last tag:
#   fix:              -> patch (v0.0.X)
#   feat:             -> minor (v0.X.0)
#   feat!: / BREAKING CHANGE -> major (vX.0.0)
# Anything else falls back to default_bump (patch). Set default_bump to false
# below to release ONLY when a feat/fix is present.
#
# Because Go modules are versioned by their git tag, this tag *is* the release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  # Required to create a tag whose tree contains .github/workflows/*. Adding a
  # second workflow file to this repository is what broke tagging: GITHUB_TOKEN
  # cannot push a ref carrying workflow changes with contents alone, and the
  # failure reads as "Resource not accessible by integration" — which names
  # neither the permission nor the file.
  actions: write

# Never let two releases race; queue them instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, vulnesis-local]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history so the tagger can read prior tags/commits

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build and test
        run: |
          go build ./...
          go test ./...

      - name: Compute next version and tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          tag_prefix: v

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          generate_release_notes: true
